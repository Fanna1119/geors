[package]
name = "geors-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Command line and HTTP server for the geors geocoder"

[[bin]]
name = "geors"
path = "src/main.rs"

[workspace]
members = ["crates/*"]

[features]
# Log heap use per import step (diagnostics; see crates/geors-ingest/src/mem.rs).
mem-stats = ["geors/mem-stats"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
geors = { version = "0.1.0", path = "crates/geors", features = ["update"] }
geors-api = { version = "0.1.0", path = "crates/geors-api" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
