[package]
name = "geors"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
geors-api = { version = "0.1.0", path = "crates/geors-api" }
geors-core = { version = "0.1.0", path = "crates/geors-core" }
geors-index = { version = "0.1.0", path = "crates/geors-index" }
geors-ingest = { version = "0.1.0", path = "crates/geors-ingest" }
geors-rank = { version = "0.1.0", path = "crates/geors-rank" }
geors-update = { version = "0.1.0", path = "crates/geors-update" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
