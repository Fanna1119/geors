[package]
name = "geors-index"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Spatial and text indexes of the geors geocoder (internal crate)"
repository = "https://github.com/Fanna1119/geors"

[dependencies]
bytemuck = "1.25.2"
deunicode = "1.6.2"
geo-index = "0.4.0"
geors-core = { version = "0.1.0", path = "../geors-core" }
geors-rank = { version = "0.1.0", path = "../geors-rank" }
levenshtein_automata = "0.2.1"
memmap2 = "0.9.11"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tantivy = { version = "0.26.2", default-features = false, features = ["mmap", "lz4-compression"] }
tantivy-fst = "0.5.0"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
