# German. Abbreviations in addresses and names -> full words.

# Partitions of German-speaking countries (incl. South Tyrol, East Belgium).
countries = ["de", "at", "ch", "li", "lu", "be", "it"]

[words]
str = ["strasse"]
pl = ["platz"]
hbf = ["hauptbahnhof"]
bhf = ["bahnhof"]
st = ["sankt"]
hl = ["heilige", "heiligen"]
dr = ["doktor"]
prof = ["professor"]
gr = ["gross", "grosse"]
kl = ["klein", "kleine"]

[suffixes]
# "Hauptstr" -> "Hauptstrasse", "Marktpl" -> "Marktplatz"
str = ["strasse"]
pl = ["platz"]
