[package]
name = "geors"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast, lightweight geocoder for OpenStreetMap data: search, reverse geocoding and nearest places from memory-mapped per-country indexes"
repository = "https://github.com/Fanna1119/geors"
readme = "README.md"
keywords = ["geocoding", "openstreetmap", "osm", "search", "reverse-geocoding"]
categories = ["science::geo", "database-implementations"]

[dependencies]
geors-core = { version = "0.1.0", path = "../geors-core" }
geors-index = { version = "0.1.0", path = "../geors-index" }
geors-rank = { version = "0.1.0", path = "../geors-rank" }
arc-swap = "1.9.2"
thiserror = "2.0.21"
tracing = "0.1.44"
geojson = { version = "1.0.0", optional = true }
geors-ingest = { version = "0.1.0", path = "../geors-ingest", optional = true }
geors-update = { version = "0.1.0", path = "../geors-update", default-features = false, optional = true }
anyhow = { version = "1.0.104", optional = true }
serde_json = { version = "1.0.151", optional = true }

[features]
# Results as GeoJSON features (the HTTP API's format).
geojson = ["dep:geojson", "dep:serde_json"]
# Import local .osm.pbf files and Nominatim dumps (no network code).
import = ["dep:geors-ingest", "dep:geors-update", "dep:anyhow"]
# Registered sources, downloads and replication-diff updates (HTTP client).
update = ["import", "geors-update/download"]
# Report allocator statistics during imports (needs `geors::mem::Counting`
# as the global allocator).
mem-stats = ["import", "geors-ingest/mem-stats"]

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.151"

[[example]]
name = "import"
required-features = ["import"]
