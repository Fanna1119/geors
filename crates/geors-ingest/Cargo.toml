[package]
name = "geors-ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
flate2 = "1.1.10"
geo = "0.33.1"
geo-index = "0.4.0"
geors-core = { version = "0.1.0", path = "../geors-core" }
memmap2 = "0.9.11"
osmpbf = "0.3.8"
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"

[dev-dependencies]
geors-index = { path = "../geors-index" }
tempfile = "3.27.0"

[features]
# Heap accounting per import step (see `mem.rs`).
mem-stats = ["geors-core/mem-stats"]
